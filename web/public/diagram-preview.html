<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liber · вид схемы</title>
    <style>
      :root {
        --ink: #1a2e22;
        --muted: #5a6b60;
        --accent: #6b8f76;
        --line: #d5ddd7;
        --bg: #eef3ef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(160deg, #e8efe9 0%, #f7f9f6 55%, #eef2ea 100%);
        color: var(--ink);
        min-height: 100vh;
        padding: 1.5rem;
      }
      .wrap { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 1.15rem; margin: 0 0 0.75rem; }
      .shot {
        width: 100%;
        border-radius: 16px;
        border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
        box-shadow: 0 12px 36px rgba(20, 40, 28, 0.12);
        background: #fff;
        display: block;
      }
      .note {
        margin-top: 1rem;
        font-size: 0.9rem;
        color: var(--muted);
        font-family: system-ui, sans-serif;
        line-height: 1.45;
      }
      code { font-size: 0.85em; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Так выглядит схема в Artifact rail</h1>
      <img
        class="shot"
        src="/diagram-preview.png"
        width="900"
        height="920"
        alt="Liber diagram: strip Схемы, flowchart soft-green, кнопки fullscreen и PNG"
      />
      <p class="note">
        Strip «Схемы» → flowchart soft-green → «На весь экран» / «Скачать PNG».<br />
        Прямой файл:
        <a href="/diagram-preview.png">diagram-preview.png</a>
      </p>
    </div>
  </body>
</html>
