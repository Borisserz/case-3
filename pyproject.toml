[project]
name = "case-3"
version = "0.3.0"
description = "Text → Qwen LaTeX → PDF/DOCX via Docker"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
case3 = "case3.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
case3 = ["templates/*.tex"]
