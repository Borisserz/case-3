[project]
name = "case-3"
version = "0.2.0"
description = "Text/images → LaTeX (Qwen) → PDF/DOCX via Docker"
requires-python = ">=3.9"
dependencies = [
  "pillow>=10.0",
]

[project.scripts]
case3 = "case3.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
case3 = ["prompts/*.md", "templates/*.tex"]
