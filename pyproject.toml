[project]
name = "case-3"
version = "0.4.0"
description = "Text → Qwen LaTeX + HTML charts → PDF/DOCX via Docker"
requires-python = ">=3.9"
dependencies = [
  "playwright>=1.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.scripts]
case3 = "case3.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
case3 = ["templates/*.tex", "templates/*.html"]
