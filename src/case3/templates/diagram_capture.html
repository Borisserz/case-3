<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-width: 1920px;
      min-height: 1080px;
      width: max-content;
      height: max-content;
      background: transparent;
      overflow: visible;
    }
    #wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      box-sizing: border-box;
    }
    #diagram {
      max-width: 100%;
      max-height: 100%;
    }
    #diagram svg {
      /* sized in JS after render — leave room for stroke/text */
      overflow: visible;
    }
    .edgeLabel, .edgeLabel span, .edgeLabel p, .labelBkg {
      background: transparent !important;
      fill: transparent !important;
    }
  </style>
</head>
<body>
  <div id="wrap"><div id="diagram" class="mermaid">{{MERMAID}}</div></div>
  <script src="mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: "base",
      securityLevel: "strict",
      flowchart: {
        htmlLabels: true,
        curve: "basis",
        padding: 20,
        nodeSpacing: 48,
        rankSpacing: 56,
        useMaxWidth: false
      },
      themeVariables: {
        fontSize: "22px",
        fontFamily: "Georgia, 'Times New Roman', serif",
        primaryColor: "#dce8df",
        primaryTextColor: "#1a2e22",
        primaryBorderColor: "#6b8f76",
        lineColor: "#5a7a64",
        secondaryColor: "#f4f7f4",
        tertiaryColor: "#eef3ef",
        background: "transparent",
        mainBkg: "#eef3ef",
        nodeBorder: "#6b8f76",
        clusterBkg: "#f4f7f4",
        titleColor: "#1a2e22",
        edgeLabelBackground: "transparent"
      }
    });
  </script>
</body>
</html>
