<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-width: 1920px;
      min-height: 1080px;
      width: max-content;
      height: max-content;
      background: #fffcf7;
      overflow: visible;
    }
    #wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      box-sizing: border-box;
    }
    #diagram {
      max-width: 100%;
      max-height: 100%;
    }
    #diagram svg {
      /* sized in JS after render — leave room for stroke/text */
      overflow: visible;
    }
  </style>
</head>
<body>
  <div id="wrap"><div id="diagram" class="mermaid">{{MERMAID}}</div></div>
  <script src="mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: "base",
      securityLevel: "strict",
      flowchart: {
        htmlLabels: true,
        curve: "basis",
        padding: 36,
        nodeSpacing: 70,
        rankSpacing: 90,
        useMaxWidth: false
      },
      themeVariables: {
        fontSize: "44px",
        fontFamily: "system-ui, Segoe UI, sans-serif",
        primaryColor: "{{PRIMARY}}",
        primaryTextColor: "#14161a",
        primaryBorderColor: "{{ACCENT}}",
        lineColor: "#3d4536",
        secondaryColor: "#f0ede4",
        tertiaryColor: "#fffcf7",
        background: "#fffcf7",
        mainBkg: "#fffcf7",
        nodeBorder: "{{ACCENT}}",
        clusterBkg: "#f0ede4",
        titleColor: "#14161a",
        edgeLabelBackground: "#fffcf7"
      }
    });
  </script>
</body>
</html>
