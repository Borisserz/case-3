<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; script-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <style>
    @font-face {
      font-family: "Liber Sans";
      font-style: normal;
      font-weight: 400;
      src: url("fonts/sans-400-cyr.woff2") format("woff2"),
           url("fonts/sans-400-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Liber Sans";
      font-style: normal;
      font-weight: 500;
      src: url("fonts/sans-500-cyr.woff2") format("woff2"),
           url("fonts/sans-500-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Liber Sans";
      font-style: normal;
      font-weight: 600;
      src: url("fonts/sans-600-cyr.woff2") format("woff2"),
           url("fonts/sans-600-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Liber Sans";
      font-style: normal;
      font-weight: 700;
      src: url("fonts/sans-700-cyr.woff2") format("woff2"),
           url("fonts/sans-700-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Liber Serif";
      font-style: normal;
      font-weight: 600;
      src: url("fonts/serif-600-cyr.woff2") format("woff2"),
           url("fonts/serif-600-latin.woff2") format("woff2");
    }

    :root {
      --primary: {{PRIMARY}};
      --accent: {{ACCENT}};
      --ink: {{INK}};
      --ink-2: {{INK2}};
      --muted: {{MUTED}};
      --paper: {{PAPER}};
      --sheet: {{SHEET}};
      --rule: {{RULE}};
      --foil: {{FOIL}};
      --panel: {{PANEL}};
      --deck-primary: {{PRIMARY}};
      --deck-accent: {{ACCENT}};
      --deck-bg: {{SHEET}};
      --deck-text: {{INK}};
      --deck-panel: {{PANEL}};
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--paper);
    }
    #slide {
      width: 1920px;
      height: 1080px;
      margin: 0;
      position: relative;
      background:
        radial-gradient(900px 480px at 100% 0%, color-mix(in srgb, var(--accent) 3%, transparent), transparent 55%),
        var(--sheet);
      color: var(--ink);
      font-family: "Liber Sans", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #slide::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    .slide-inner {
      position: absolute;
      inset: 64px 88px 72px 88px;
      display: flex;
      flex-direction: column;
    }
    .brand {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .brand span { color: var(--primary); }
    h1 {
      margin: 0;
      font-family: "Liber Serif", Georgia, serif;
      font-weight: 600;
      font-size: 68px;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--ink);
      max-width: 1480px;
    }
    .subtitle {
      margin-top: 24px;
      font-size: 26px;
      font-weight: 500;
      color: var(--muted);
      max-width: 1100px;
      line-height: 1.4;
    }
    .title-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 40px;
      position: relative;
    }
    /* Voltage title: Julius-like geometric foil (non-split only) */
    #slide[data-pack="voltage"][data-layout="title"] .title-stage:not(.title-stage--split):not(.title-stage--bleed)::after {
      content: "";
      position: absolute;
      right: 40px;
      top: 18%;
      width: 200px;
      height: 200px;
      border: 2px solid color-mix(in srgb, var(--foil) 60%, transparent);
      border-radius: 6px;
      transform: rotate(14deg);
      pointer-events: none;
      opacity: 0.65;
      z-index: 0;
    }
    #slide[data-pack="voltage"][data-layout="title"] .title-stage:not(.title-stage--split):not(.title-stage--bleed)::before {
      content: "";
      position: absolute;
      right: 160px;
      bottom: 16%;
      width: 110px;
      height: 110px;
      background: color-mix(in srgb, var(--accent) 28%, transparent);
      border-radius: 3px;
      pointer-events: none;
      z-index: 0;
    }
    #slide[data-pack="voltage"][data-layout="title"] .title-stage > * {
      position: relative;
      z-index: 1;
    }
    /* Signal / ink titles: slightly larger display weight */
    #slide[data-pack="signal"][data-layout="title"] h1,
    #slide[data-pack="ink"][data-layout="title"] h1 {
      font-size: 76px;
      max-width: 1320px;
    }
    .title-stage--split {
      /* Full-bleed split: ignore default slide-inner margins */
      display: grid !important;
      grid-template-columns: minmax(0, 0.55fr) minmax(0, 0.45fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 0;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100%;
      height: 100%;
      padding: 0 !important;
      margin: 0;
      box-sizing: border-box;
    }
    .title-stage--split .title-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 48px 80px 88px;
      min-height: 0;
      height: 100%;
      box-sizing: border-box;
    }
    .title-stage--split .title-panel {
      background: var(--panel);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-self: stretch;
      height: 100%;
      min-height: 0;
      padding: 72px 64px 80px;
      box-sizing: border-box;
    }
    .title-stage--split .title-panel .takeaway {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--ink);
      white-space: pre-line;
    }
    .hero-metrics {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 44px;
      width: 100%;
    }
    .hero-metric__value {
      margin: 0;
      font-family: "Liber Sans", "Segoe UI", system-ui, sans-serif;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.02;
      color: var(--ink);
    }
    .hero-metric__label {
      margin: 10px 0 0;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--ink-2);
      max-width: 16em;
    }
    .title-stage--split .brand { margin-bottom: 28px; }
    .title-stage--split h1 { font-size: 56px; max-width: none; }
    /* Relay / Split Pastel: Julius-like geometric sans display */
    #slide[data-pack="relay"] h1,
    #slide[data-pack="pastel"] h1,
    #slide[data-pack="relay"] .kpi-card .value,
    #slide[data-pack="pastel"] .kpi-card .value,
    #slide[data-pack="relay"] .section-splash__title,
    #slide[data-pack="pastel"] .section-splash__title {
      font-family: "Liber Sans", "Segoe UI", system-ui, sans-serif;
      font-weight: 700;
    }
    #slide[data-layout="title"]:has(.title-stage--split)::before { display: none; }
    #slide[data-layout="title"]:has(.title-stage--split) .footer-rule { display: none; }
    .section-head {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 0 0 16px;
      max-width: 1480px;
      flex-shrink: 0;
    }
    #slide[data-layout="scorecard"] .section-head,
    #slide[data-layout="card_row"] .section-head {
      margin-bottom: 12px;
    }
    .section-head .kicker {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      line-height: 1.2;
    }
    .section-head .kicker::after {
      content: "";
      display: block;
      width: 48px;
      height: 2px;
      margin-top: 10px;
      background: var(--foil);
    }
    .title-stage > .kicker {
      margin: 0 0 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .section-title {
      margin: 0;
      font-family: "Liber Serif", Georgia, serif;
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.12;
      color: var(--ink);
    }
    .section-head:has(.kicker) .section-title {
      font-size: 44px;
      letter-spacing: -0.02em;
    }
    .section-head--compact { margin-bottom: 14px; }
    .section-head--compact .kicker { margin-bottom: 8px; font-size: 12px; }
    .section-head--compact .section-title { font-size: 36px; }
    .section-head--compact:has(.kicker) .section-title { font-size: 38px; }
    .chart-hero .section-title { font-size: 36px; }
    .chapter {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--primary);
    }
    .takeaway {
      margin: 14px 0 0;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--ink-2);
      max-width: 1200px;
    }
    .takeaway--hero {
      margin-top: 20px;
      font-size: 24px;
      color: var(--muted);
    }
    /* Section splash — twin of PPTX side accent panel */
    .slide-inner.section-splash {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 32%);
      grid-template-rows: auto 1fr;
      gap: 0 48px;
      inset: 64px 0 72px 88px;
      padding-right: 0;
    }
    .section-splash .brand { grid-column: 1; grid-row: 1; }
    .section-splash__main {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 48px;
      max-width: 920px;
    }
    .section-splash__title {
      margin: 0;
      font-family: "Liber Serif", Georgia, serif;
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--ink);
    }
    .section-splash__sub {
      margin: 20px 0 0;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--muted);
      max-width: 720px;
    }
    .section-splash__panel {
      grid-column: 2;
      grid-row: 1 / -1;
      margin: -64px 0 -72px 0;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .section-splash__num {
      margin: 0;
      font-family: "Liber Serif", Georgia, serif;
      font-size: 96px;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--ink);
      line-height: 1;
    }
    .kpi-card .delta {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      width: fit-content;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .kpi-card .delta.status-up {
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .kpi-card .delta.status-down {
      color: var(--primary);
      background: color-mix(in srgb, var(--primary) 12%, transparent);
    }
    .kpi-card .delta.status-flat {
      color: var(--muted);
      background: color-mix(in srgb, var(--muted) 14%, transparent);
    }
    .scorecard-grid .kpi-card {
      min-height: 300px;
      padding: 40px 32px 44px;
    }
    .scorecard-grid .kpi-card .value {
      font-size: 58px;
    }
    .callout-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      margin-top: 12px;
      margin-bottom: 8px;
      padding: 56px 64px;
      background: var(--paper);
      border: 1px solid var(--accent);
      border-radius: 16px;
      max-width: 1480px;
      min-height: 420px;
      box-sizing: border-box;
    }
    .callout__term {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .callout__def {
      margin: 0;
      font-family: "Liber Serif", Georgia, serif;
      font-size: 40px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--ink);
      max-width: 1280px;
    }
    .callout__body {
      margin: 4px 0 0;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--ink-2);
      max-width: 1100px;
    }
    .chart-hero .chart-stage {
      flex: 1;
      min-height: 520px;
      padding: 6px 10px;
    }
    .chart-hero .chart-stage img {
      width: 100%;
      height: 100%;
      max-height: 720px;
      object-fit: contain;
    }
    table.deck-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 18px;
      background: var(--sheet);
    }
    table.deck-table th,
    table.deck-table td {
      padding: 14px 18px;
      text-align: left;
      border: 1px solid var(--rule);
      color: var(--ink);
      vertical-align: top;
    }
    table.deck-table th {
      background: var(--primary);
      color: var(--sheet);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    table.deck-table tr:nth-child(even) td {
      background: color-mix(in srgb, var(--paper) 55%, var(--sheet));
    }
    ul.bullets {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 1480px;
    }
    ul.bullets li {
      position: relative;
      padding-left: 34px;
      font-size: 26px;
      line-height: 1.35;
      font-weight: 400;
      color: var(--ink-2);
    }
    ul.bullets li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
    }
    .kpi-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(var(--kpi-cols, 3), minmax(0, 1fr));
      grid-auto-rows: 1fr;
      gap: 28px;
      /* Fill the band under the title — no floating mid-void */
      align-content: stretch;
      align-items: stretch;
      margin-top: 8px;
      min-height: 0;
      padding-bottom: 8px;
    }
    .kpi-card {
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
      padding: 36px 32px 40px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: flex-start;
    }
    .kpi-card .value {
      font-family: "Liber Serif", Georgia, serif;
      font-size: 50px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1.05;
    }
    .kpi-card .label {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink-2);
    }
    .kpi-card .hint {
      margin-top: auto;
      min-height: 1.2em;
      font-size: 17px;
      color: var(--muted);
      font-weight: 500;
    }
    .chart-hero {
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      min-height: 0;
    }
    .chart-stage {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 16px 20px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rule) 55%, transparent);
    }
    .chart-stage img {
      max-width: 100%;
      max-height: 620px;
      width: 100%;
      object-fit: contain;
      display: block;
    }
    .chart-empty {
      min-height: 360px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .chart-split {
      flex: 1;
      display: grid;
      grid-template-columns: 0.44fr 0.56fr;
      gap: 48px;
      min-height: 0;
      align-items: center;
    }
    .chart-split .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      min-width: 0;
    }
    .chart-split .body {
      margin: 0;
      font-size: 22px;
      line-height: 1.5;
      color: var(--ink-2);
      font-weight: 500;
    }
    .chart-split .chart-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .chart-split .chart-stage img { max-height: 580px; }
    .caption {
      font-size: 18px;
      color: var(--muted);
      line-height: 1.4;
      max-width: 1480px;
      margin: 0;
    }
    .caption--insight {
      font-size: 22px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
      padding-left: 16px;
      border-left: 3px solid var(--foil, var(--accent));
      max-width: 56em;
    }
    .closing-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .closing-stage .section-title { font-size: 52px; }
    .closing-stage .section-head { margin-bottom: 32px; }

    .slide-inner.media-hero {
      flex: 1;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      min-height: 0;
    }
    .media-frame {
      min-height: 0;
      display: flex;
      padding: 3px;
      background: var(--sheet);
      border: 1px solid var(--rule);
    }
    /* Diagrams: let the PNG own the 1fr row (no empty letterbox chrome). */
    .media-hero .media-frame--diagram {
      justify-self: center;
      align-self: stretch;
      width: fit-content;
      max-width: 100%;
      height: 100%;
      border: none;
      padding: 0;
      background: transparent;
    }
    .media-frame__inset {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      background: color-mix(in srgb, var(--paper) 88%, white);
      border: 1px solid color-mix(in srgb, var(--rule) 70%, var(--paper));
    }
    .media-frame--diagram .media-frame__inset {
      padding: 0;
      background: transparent;
      border: none;
    }
    .media-frame img {
      display: block;
      max-width: 100%;
      max-height: 720px;
      object-fit: contain;
    }
    .media-frame--diagram img {
      max-height: min(900px, 100%);
      width: auto;
      height: 100%;
      max-width: min(1680px, 100%);
      object-fit: contain;
      object-position: center;
    }
    .media-frame--photo img {
      max-height: 680px;
      object-fit: cover;
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    .media-caption {
      margin: 0;
      max-width: 1200px;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--muted);
      border-top: 1px solid var(--rule);
      padding-top: 14px;
    }
    .media-caption__lead {
      color: var(--ink-2);
      font-weight: 600;
    }
    .slide-inner.media-split {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .media-split__grid {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 0.38fr) minmax(0, 0.62fr);
      gap: 40px;
      align-items: center;
      min-height: 0;
    }
    .media-split__grid.is-diagram {
      grid-template-columns: minmax(0, 0.32fr) minmax(0, 0.68fr);
    }
    .media-split__copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      min-width: 0;
    }
    .media-split__body {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--ink-2);
      max-width: 640px;
    }
    .media-split__aside {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .media-frame--thumb .media-frame__inset {
      min-height: 420px;
      max-height: 640px;
      padding: 12px 16px;
    }
    .media-frame--thumb img { max-height: 600px; }
    .media-frame--thumb.media-frame--diagram img { max-height: 620px; }
    .media-aside-caption {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--muted);
    }
    .media-aside-caption::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 10px;
      vertical-align: 0.15em;
      background: var(--accent);
      border-radius: 1px;
    }
    .footer-rule {
      position: absolute;
      left: 88px;
      right: 88px;
      bottom: 44px;
      height: 1px;
      background: var(--rule);
    }

      border-radius: 6px;
      border-width: 2px;
      border-color: var(--accent);
    }
    #slide[data-pack="board"] table.deck-table {
      border-radius: 0;
    }
    #slide[data-pack="board"] table.deck-table th {
      border-radius: 0 !important;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 14px;
    }

    /* Signal: charcoal cards, orange foil left only, no soft pastel */
    #slide[data-pack="signal"] .kpi-card,
    #slide[data-pack="signal"] .narr-card {
      border-radius: 2px;
      border-top: none;
      border-right: none;
      border-bottom: none;
      border-left: 4px solid var(--foil);
    }
    #slide[data-pack="signal"] .callout-box {
      border-radius: 2px;
      border-width: 1px 1px 1px 4px;
      border-color: var(--foil);
    }
    #slide[data-pack="signal"] table.deck-table th {
      border-radius: 0 !important;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #slide[data-pack="signal"] .section-title,
    #slide[data-pack="signal"] h1 {
      font-family: "Liber Serif", Georgia, serif;
    }

    /* Relay / pastel: soft pills, no left bars, panel fills */
    #slide[data-pack="relay"] .kpi-card,
    #slide[data-pack="pastel"] .kpi-card,
    #slide[data-pack="relay"] .narr-card,
    #slide[data-pack="pastel"] .narr-card {
      border: none !important;
      border-left: none !important;
      border-radius: 20px;
      box-shadow: none;
    }
    #slide[data-pack="relay"] .callout-box,
    #slide[data-pack="pastel"] .callout-box {
      border: none !important;
      border-radius: 24px;
    }
    #slide[data-pack="relay"] .section-splash__panel,
    #slide[data-pack="pastel"] .section-splash__panel {
      border-radius: 0;
    }
    #slide[data-pack="relay"] h1,
    #slide[data-pack="pastel"] h1,
    #slide[data-pack="relay"] .section-title,
    #slide[data-pack="pastel"] .section-title {
      font-family: "Liber Sans", system-ui, sans-serif;
      font-weight: 700;
    }

    /* Voltage: sharp geometry, top accent only, lime meters */
    #slide[data-pack="voltage"] .kpi-card,
    #slide[data-pack="voltage"] .narr-card,
    #slide[data-pack="voltage"] .callout-box {
      border-radius: 0;
    }
    #slide[data-pack="voltage"] .narr-card {
      border: 1px solid var(--rule);
      border-top: 3px solid var(--foil);
      border-left: none;
    }
    #slide[data-pack="voltage"] .kpi-card {
      border-left: none;
      border-top: 3px solid var(--foil);
    }
    #slide[data-pack="voltage"] table.deck-table {
      border-radius: 0;
    }
    #slide[data-pack="voltage"] .section-title {
      font-family: "Liber Serif", Georgia, serif;
    }

    /* Ink: sparse ice — large type, soft cards, minimal borders */
    #slide[data-pack="ink"] .kpi-card,
    #slide[data-pack="ink"] .narr-card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    #slide[data-pack="ink"] .callout-box {
      border-radius: 18px;
      border-width: 1px;
      min-height: 480px;
    }
    #slide[data-pack="ink"] .section-splash__title,
    #slide[data-pack="ink"] h1 {
      font-size: 72px;
      max-width: 1100px;
    }
    #slide[data-pack="ink"] .scorecard-grid {
      gap: 36px;
    }

    /* Botanical: foil frames, moss panels, soft radius */
    #slide[data-pack="botanical"] .kpi-card,
    #slide[data-pack="botanical"] .narr-card,
    #slide[data-pack="botanical"] .callout-box {
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--foil) 50%, transparent);
      border-left: 1px solid color-mix(in srgb, var(--foil) 50%, transparent);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
    }
    #slide[data-pack="botanical"] .section-splash__title {
      font-style: italic;
    }
    #slide[data-pack="botanical"] table.deck-table th {
      background: color-mix(in srgb, var(--primary) 70%, var(--foil));
      letter-spacing: 0.04em;
    }

    /* Atelier: editorial olive — soft paper chips */
    #slide[data-pack="atelier"] .kpi-card {
      border-radius: 12px;
      border: none;
      border-left: 3px solid var(--accent);
      background: var(--paper);
    }
    #slide[data-pack="atelier"] .narr-card {
      border: none;
      border-radius: 12px;
      border-top: 2px solid var(--foil);
    }
    #slide[data-pack="atelier"] .callout-box {
      border-radius: 12px;
      border-color: var(--foil);
    }
    #slide[data-pack="atelier"] .bullets li::before {
      background: var(--accent);
    }

    /* Studio: ice workshop — numbered feel, soft indigo */
    #slide[data-pack="studio"] .kpi-card,
    #slide[data-pack="studio"] .narr-card {
      border: none;
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 10%, transparent);
    }
    #slide[data-pack="studio"] .narr-card__kicker {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.1em;
    }
    #slide[data-pack="studio"] .callout-box {
      border-radius: 16px;
      border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent);
      background: color-mix(in srgb, var(--paper) 70%, white);
    }
    #slide[data-pack="studio"] table.deck-table th {
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div id="slide" data-layout="{{LAYOUT}}" data-pack="{{PACK}}">
    {{BODY}}
    <div class="footer-rule" aria-hidden="true"></div>
    <div class="footer-mark">{{BRAND_MARK}}</div>
  </div>
</body>
</html>
