<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    #mount {
      width: 960px;
      min-height: 540px;
      padding: 28px 32px;
      box-sizing: border-box;
      font-family: "Segoe UI", "DejaVu Sans", sans-serif;
      color: #1e293b;
    }
    canvas { max-width: 100%; display: block; margin: 0 auto; }
    .kpi {
      display: flex; flex-direction: column; justify-content: center;
      min-height: 480px; text-align: center;
    }
    .kpi .value { font-size: 76px; font-weight: 700; color: #2563eb; letter-spacing: -0.02em; }
    .kpi .label { font-size: 22px; color: #475569; margin-top: 14px; font-weight: 500; }
  </style>
  <script src="{{CHART_JS}}"></script>
  <script>
    if (window.Chart) {
      Chart.defaults.animation = false;
      Chart.defaults.responsive = false;
      Chart.defaults.maintainAspectRatio = false;
      Chart.defaults.font.family = '"Segoe UI", "DejaVu Sans", sans-serif';
      Chart.defaults.font.size = 14;
      Chart.defaults.color = '#334155';
      Chart.defaults.plugins.legend.labels.boxWidth = 14;
      Chart.defaults.plugins.legend.labels.padding = 16;
      Chart.defaults.elements.bar.borderRadius = 4;
      Chart.defaults.elements.line.borderWidth = 2.5;
      Chart.defaults.scale.grid.color = 'rgba(148,163,184,0.35)';
    }
  </script>
</head>
<body>
  <div id="mount">{{FRAGMENT}}</div>
</body>
</html>
