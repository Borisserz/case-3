services:
  stimulsoft:
    build:
      context: ./backend/stimulsoft
      dockerfile: Dockerfile
    image: case-3:stimulsoft
    restart: unless-stopped
    ports:
      - "${CASE3_STIMULSOFT_HOST_PORT:-8040}:${VIEWER_PORT:-8040}"
    env_file:
      - path: ./backend/stimulsoft/.env
        required: false
    environment:
      VIEWER_HOST: 0.0.0.0
      VIEWER_PORT: ${VIEWER_PORT:-8040}
      VIEWER_OPEN: "0"
      # База остаётся на хосте. 127.0.0.1 внутри контейнера — это сам контейнер.
      POSTGRES_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # .mrt и лицензия в образ не входят.
      - ./backend/stimulsoft/local:/app/local:ro
      - ./backend/stimulsoft/dashboards:/app/dashboards:ro
      - stimulsoft-exports:/app/exports

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: case-3:backend
    platform: linux/amd64
    restart: unless-stopped
    shm_size: "1gb"
    depends_on:
      - stimulsoft
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CASE3_TEX_LOCAL: "1"
      CASE3_PORT: ${CASE3_PORT:-8000}
      DASHBOARD_SERVICE_URL: http://stimulsoft:${VIEWER_PORT:-8040}
      DASHBOARD_PUBLIC_URL: "${DASHBOARD_PUBLIC_URL:-http://127.0.0.1:8040}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/runs:/app/runs
      - ./backend/local:/app/local
    ports:
      # Слева — порт на Windows. 8000 на хосте занят image-моделью, поэтому снаружи 8010.
      - "${CASE3_BACKEND_HOST_PORT:-8010}:${CASE3_PORT:-8000}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: case-3:frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CASE3_PORT: ${CASE3_PORT:-8000}
    ports:
      - "${CASE3_FRONTEND_HOST_PORT:-5173}:80"

  tex:
    build:
      context: ./backend
      dockerfile: Dockerfile.tex
    image: case-3:tex
    profiles: ["tex-only"]

volumes:
  stimulsoft-exports:
