[metadata]
name = case-3
version = 0.2.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    pillow>=10.0

[options.packages.find]
where = src

[options.package_data]
case3 =
    prompts/*.md
    templates/*.tex

[options.entry_points]
console_scripts =
    case3 = case3.cli:main
